<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Score analyzer</title>
</head>
<style>
  body {
      background-color: #f0f8ff;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #0077cc;
      margin-bottom: 10px;
    }
    .subject-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin: 10px;
    }
    .subject-card img {
      width: 300px;
      height: 300px;
      margin-bottom: 10px;
      border-radius: 10px; 
    }
</style>
<!-- i used chatgpt to help me do the subject card to make it more aesthetically better -->
<body>
  <h1>Score Analyzer</h1>
  <p>Enter your grades in the following subjects:</p>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-3 subject-card bg-light">
        <img src="https://i.pinimg.com/1200x/70/d7/da/70d7da72e4298ffc2cb3db6ed2b34ae2.jpg">
        <h4>Science</h4>
        <input id="science" type="number" class="form-control" placeholder="Enter Science Grade">
      </div>
      <div class="col-md-3 subject-card bg-light">
      	<img src="https://thumbs.dreamstime.com/b/blue-concept-maths-subject-vector-linear-round-school-line-icons-textbooks-board-equations-students-theorems-108220859.jpg">
        <h4>Math</h4>
        <input id="math" type="number" class="form-control" placeholder="Enter Math Grade">
      </div>
      <div class="col-md-3 subject-card bg-light">
      	<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRghn1lh3NsiUjzFllbTWCPZ664W9F-W6uLpHInWQ5Lhf_EVJm8msLb4qXUjwPQ79Spcjs&usqp=CAU">
        <h4>Filipino</h4>
        <input id="filipino" type="number" class="form-control" placeholder="Enter Filipino Grade">
      </div>
    </div>
    <button onclick="rating()" class="btn btn-primary mt-4">Get Rating</button>
  </div>
  <center><br><br><br><br><br><a href="https://gwacalculator.ph/grading-system-in-philippines/#:~:text=In%20the%20Philippines%2C%20the%20grading%20system%20can%20be%20a%205,is%20the%20lowest%20passing%20grade.">Citation
</body>
<script>
	function rating() {
    let science = Number(document.getElementById("science").value);
    let math = Number(document.getElementById("math").value);
    let english = Number(document.getElementById("filipino").value);

    let average = (science + math + english) / 3;

    let rating = "";

    switch (true) {
      case (average >= 94 && average <= 100):
        rating = "Excellent";
        break;
      case (average >= 87 && average < 94):
        rating = "Above Satisfactory";
        break;
      case (average >= 80 && average < 87):
        rating = "Satisfactory";
        break;
      case (average >= 75 && average < 80):
        rating = "Needs Improvement";
        break;
      case (average >= 70 && average < 75):
        rating = "Poor";
        break;
      default:
        rating = "Very low grade";
    }

    alert("Your average is " + average.toFixed(2) + " - " + rating);
  }
</script>
</html>
